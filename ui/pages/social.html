<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social &amp; Support</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <section class="page-view page" data-view="social">
        <div class="page-heading">
            <h1>Social &amp; Support</h1>
            <p>Stay connected with NISPAX InfoTech and get help when you need it.</p>
        </div>

        <div class="social-section-label">Connect with NISPAX InfoTech</div>
        <div class="social-grid">
            <a class="social-card" href="https://youtube.com/@NispaxOfficial" data-external-url="https://youtube.com/@NispaxOfficial">
                <span class="social-card-icon social-icon-youtube" aria-hidden="true"><img src="../assets/youtube.svg" alt=""></span>
                <span><strong>YouTube</strong><small>@NispaxOfficial</small></span>
                <span class="social-card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </a>
            <a class="social-card" href="https://instagram.com/nispax.in" data-external-url="https://instagram.com/nispax.in">
                <span class="social-card-icon social-icon-instagram" aria-hidden="true"><img src="../assets/instagram.svg" alt=""></span>
                <span><strong>Instagram</strong><small>@nispax.in</small></span>
                <span class="social-card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </a>
            <a class="social-card" href="https://discord.gg/6HFySAMv6K" data-external-url="https://discord.gg/6HFySAMv6K">
                <span class="social-card-icon social-icon-discord" aria-hidden="true"><img src="../assets/discord.svg" alt=""></span>
                <span><strong>Discord</strong><small>Join the NISPAX community</small></span>
                <span class="social-card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </a>
        </div>

        <div class="social-section-label social-section-support">Support</div>
        <div class="social-grid">
            <a class="social-card" href="https://www.nispax.in/" data-external-url="https://www.nispax.in/">
                <span class="social-card-icon" aria-hidden="true"><img src="../assets/website.svg" alt=""></span>
                <span><strong>Website</strong><small>www.nispax.in</small></span>
                <span class="social-card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </a>
            <a class="social-card" href="mailto:nispaxofficial@gmail.com" data-external-url="mailto:nispaxofficial@gmail.com">
                <span class="social-card-icon" aria-hidden="true"><img src="../assets/email.svg" alt=""></span>
                <span><strong>Email support</strong><small>nispaxofficial@gmail.com</small></span>
                <span class="social-card-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg></span>
            </a>
        </div>
    </section>
    <script src="../js/page.js"></script>
</body>
</html>
