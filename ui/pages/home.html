<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouLoad</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<section class="page-view page" data-view="home">
    <div class="page-heading"><h1>Welcome to YouLoad</h1><p>Your video downloads, queue and recent activity in one place.</p></div>
    <div class="dashboard-grid">
        <div class="stat-card"><div id="homeDownloadCount" class="stat-value">0</div><div class="stat-label">Checked videos</div></div>
        <div class="stat-card"><div id="homeQueueCount" class="stat-value">0</div><div class="stat-label">In queue</div></div>
        <div class="stat-card"><div id="homeLastActivity" class="stat-value">Nothing yet</div><div class="stat-label">Last activity</div></div>
    </div>
    <div class="section-heading"><h2>Recent activity</h2><button class="secondary-button" data-go-to="history">View history</button></div>
    <div id="homeRecent" class="list-panel empty-panel"><div class="empty-title">No activity yet</div><div class="empty-subtitle">Checked videos will appear here.</div></div>
</section>
<script src="../js/page.js"></script>
</body>
</html>
