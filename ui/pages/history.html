<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouLoad</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<section class="page-view page" data-view="history">
    <div class="page-heading"><h1>History</h1><p>Videos you've checked in YouLoad.</p></div>
    <div class="section-heading"><h2>Recent</h2><button id="clearHistoryButton" class="secondary-button">Clear history</button></div>
    <div id="historyList" class="list-panel empty-panel"><div class="empty-title">No history yet</div><div class="empty-subtitle">Checked videos will appear here.</div></div>
</section>
<script src="../js/page.js"></script>
</body>
</html>
