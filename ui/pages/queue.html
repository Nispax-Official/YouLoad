<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YouLoad</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<section class="page-view page" data-view="queue">
    <div class="page-heading"><h1>Queue</h1><p>Videos waiting to be downloaded.</p></div>
    <div class="section-heading"><h2>Waiting</h2><button id="clearQueueButton" class="secondary-button">Clear queue</button></div>
    <div id="queueList" class="list-panel empty-panel"><div class="empty-title">Your queue is empty</div><div class="empty-subtitle">Add a video from the Download page.</div></div>
</section>
<script src="../js/page.js"></script>
</body>
</html>
