<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouLoad</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
</head>
<body>
    <div id="loadingScreen" class="loading-screen">
        <div class="loading-center">
            <img
                class="loading-icon"
                src="assets/youload-icon.png"
                alt="YouLoad"
            >
            <div class="loading-dots" aria-label="Loading">
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="loading-tip-label">DID YOU KNOW</div>
            <div id="loadingMessage" class="loading-message">Loading a useful tip...</div>
        </div>
    </div>

    <div id="appShell" class="app-shell is-hidden">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-lockup">
                    <img
                        class="brand-icon"
                        src="assets/youload-icon.png"
                        alt=""
                    >
                    <div class="wordmark">YouLoad</div>
                </div>
                <div class="publisher">by NISPAX InfoTech</div>
            </div>

            <nav class="nav">
                <button class="nav-item active" data-page="home">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="m3 10 9-7 9 7"/>
                        <path d="M5 9.5V21h14V9.5"/>
                        <path d="M9 21v-7h6v7"/>
                    </svg>
                    <span>Home</span>
                </button>
                <button class="nav-item" data-page="download">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3v12"/>
                        <path d="m7 10 5 5 5-5"/>
                        <path d="M5 21h14"/>
                    </svg>
                    <span>Download</span>
                </button>
                <button class="nav-item" data-page="queue">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="3" y="4" width="18" height="5" rx="1"/>
                        <rect x="3" y="10" width="18" height="5" rx="1"/>
                        <rect x="3" y="16" width="18" height="5" rx="1"/>
                    </svg>
                    <span>Queue</span>
                </button>
                <button class="nav-item" data-page="history">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M3 12a9 9 0 1 0 3-6.7"/>
                        <path d="M3 4v5h5"/>
                        <path d="M12 7v5l3 2"/>
                    </svg>
                    <span>History</span>
                </button>
            </nav>

            <div class="sidebar-bottom">
                <button class="nav-item" data-page="settings">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 6h16"/>
                        <path d="M4 12h16"/>
                        <path d="M4 18h16"/>
                        <circle cx="9" cy="6" r="2"/>
                        <circle cx="15" cy="12" r="2"/>
                        <circle cx="10" cy="18" r="2"/>
                    </svg>
                    <span>Settings</span>
                </button>
                <button class="nav-item" data-page="about">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M12 10v6"/>
                        <path d="M12 7h.01"/>
                    </svg>
                    <span>About</span>
                </button>
                <button class="nav-item" data-page="disclaimer">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3 3.5 6.7v5.6c0 4.9 3.2 8.1 8.5 9.7 5.3-1.6 8.5-4.8 8.5-9.7V6.7L12 3Z"/>
                        <path d="M12 8v5"/>
                        <path d="M12 16h.01"/>
                    </svg>
                    <span>Disclaimer</span>
                </button>
                <button class="nav-item" data-page="social">
                    <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H12l-4.5 4v-4h-1A2.5 2.5 0 0 1 4 13.5z"/>
                        <path d="M8 9h8M8 12h5"/>
                    </svg>
                    <span>Social &amp; Support</span>
                </button>
                <div class="app-version">v1.0.1</div>
            </div>
        </aside>

        <main class="main-content">
            <iframe id="pageFrame" class="page-frame" title="YouLoad page"></iframe>
        </main>
    </div>

    <button
        id="notificationToggle"
        class="notification-toggle is-hidden"
        type="button"
        title="Notifications"
        aria-label="Notifications"
        aria-expanded="false"
    >
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9"></path>
            <path d="M10 21h4"></path>
        </svg>
        <span id="notificationBadge" class="notification-badge is-hidden">0</span>
    </button>

    <section
        id="notificationPanel"
        class="notification-panel is-hidden"
        aria-live="polite"
        aria-label="Notifications"
    >
        <div class="notification-panel-header">
            <span>Notifications</span>
            <button
                id="dismissNotifications"
                class="notification-close"
                type="button"
                title="Dismiss notifications"
                aria-label="Dismiss notifications"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M6 6l12 12"></path>
                    <path d="M18 6L6 18"></path>
                </svg>
            </button>
        </div>
        <div id="notificationList" class="notification-list"></div>
    </section>

    <script src="js/app.js"></script>
</body>
</html>
